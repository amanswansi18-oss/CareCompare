<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - CareCompare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        
        .navbar { background: #ffffff; padding: 14px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .brand { font-size: 20px; font-weight: 800; color: #0284c7; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { background: #ffffff; width: 100%; max-width: 420px; padding: 35px 30px; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .auth-card h2 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; text-align: center; }
        .auth-card p { font-size: 13.5px; color: #64748b; text-align: center; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .input-box { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .input-box:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #0369a1; }
        
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; text-align: center; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
        .auth-footer a { color: #0284c7; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="/" class="brand"><i class="fa-solid fa-hospital-user"></i> CareCompare</a>
        <a href="/" style="color: #64748b; text-decoration: none; font-size: 14px; font-weight: 600;">← Back to Home</a>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Login to compare hospital rates and book tests</p>

            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="input-box" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="input-box" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Sign Up </a>
            </div>
        </div>
    </div>

</body>
</html>
